; DevColorz — PHP settings.
;
; .user.ini rather than php_value directives in .htaccess: under PHP-FPM, which
; is what this host runs, php_value in .htaccess is a fatal configuration error
; and takes the whole site down with a 500.
;
; Note that PHP caches this file for 300 seconds by default, so an edit takes
; up to five minutes to take effect.

expose_php = Off
display_errors = Off
log_errors = On
mail.add_x_header = Off

; Palette documents are small; this is generous.
post_max_size = 4M
upload_max_filesize = 4M
max_input_vars = 200

; PHP's own session machinery is unused — the app manages sessions in SQLite —
; but these are set anyway in case anything ever calls session_start().
session.use_strict_mode = 1
session.use_only_cookies = 1
session.cookie_httponly = 1
session.cookie_secure = 1
session.cookie_samesite = "Lax"
session.use_trans_sid = 0
